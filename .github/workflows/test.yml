name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python scripts
        run: python -m py_compile skills/agents-report/scripts/*.py skills/noon-news/scripts/*.py tests/test_scripts.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check JSON examples
        run: |
          python -m json.tool adapters/hermes/jobs.example.json >/dev/null
          python -m json.tool adapters/openclaw/jobs.example.json >/dev/null
          python -m json.tool skills/agents-report/config/codexradar_watch.example.json >/dev/null
      - name: Check whitespace
        run: git diff --check
