[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glance-brief"
version = "0.3.0"
description = "Source-grounded AI and news brief pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Unitary" }]
dependencies = []

[project.optional-dependencies]
producers = ["feedparser>=6.0,<7"]

[project.scripts]
glance-brief = "glance_brief.cli:main"

[tool.setuptools]
packages = ["glance_brief"]
include-package-data = true

[tool.setuptools.package-data]
glance_brief = ["prompts/*.md"]
